<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MovieBook - Create Account</title>

    <link rel="stylesheet" href="register.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🎬 MovieBook
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="movies.html">Movies</a>

            <a href="bookings.html">Bookings</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- ================= REGISTER SECTION ================= -->

    <main class="register-page">

        <div class="register-container">

            <div class="register-icon">
                🎬
            </div>

            <h1>
                Create Account
            </h1>

            <p class="register-subtitle">
                Join MovieBook and start booking your favourite movies
            </p>


            <!-- ================= REGISTER FORM ================= -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>


                <p id="message"></p>


                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="register.js"></script>

</body>

</html>
