<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MovieBook - Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- ================= LOGIN PAGE ================= -->

    <div class="login-container">


        <!-- Movie Icon -->

        <div class="login-icon">
            🎬
        </div>


        <!-- Heading -->

        <h1>
            Welcome Back
        </h1>


        <p class="login-subtitle">
            Login to continue booking your favourite movies
        </p>


        <!-- ================= LOGIN FORM ================= -->

        <form id="loginForm">


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>


            <!-- Error / Success Message -->

            <p id="message"></p>


        </form>


        <!-- Register -->

        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>


    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="login.js"></script>


</body>

</html>
